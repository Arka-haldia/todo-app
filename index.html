!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arka's To-Do</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
body{margin:0;min-height:100vh;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:rgba(255,255,255,0.95);width:100%;max-width:420px;border-radius:20px;padding:30px;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
h1{text-align:center;margin:0 0 20px;color:#333}
.input-box{display:flex;gap:10px;margin-bottom:20px}
input{flex:1;padding:14px;border-radius:12px;border:2px solid #eee;outline:none;font-size:16px}
input:focus{border-color:#667eea}
button.add{background:#667eea;color:white;border:none;padding:0 22px;border-radius:12px;font-weight:600;cursor:pointer;font-size:16px}
.task{background:#f7f7ff;padding:14px 16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;animation:pop 0.3s ease}
@keyframes pop{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
.del{color:#ff4d4d;background:none;border:none;font-size:18px;cursor:pointer;font-weight:bold}
.footer{text-align:center;margin-top:20px;font-size:12px;color:#888}
</style>
</head>
<body>
<div class="card">
<h1>✨ My Tasks</h1>
<div class="input-box">
<input id="taskInput" placeholder="New task likho..." />
<button class="add" onclick="addTask()">Add</button>
</div>
<div id="taskList"></div>
<div class="footer">Made with ❤️ by Arka</div>
</div>
<script>
let tasks=JSON.parse(localStorage.getItem('tasks')||'[]');
function render(){const list=document.getElementById('taskList');list.innerHTML='';tasks.forEach((t,i)=>{const div=document.createElement('div');div.className='task';div.innerHTML=`<span>${t}</span><button class="del" onclick="delTask(${i})">X</button>`;list.appendChild(div)});localStorage.setItem('tasks',JSON.stringify(tasks))}
function addTask(){const inp=document.getElementById('taskInput');if(!inp.value.trim())return;tasks.push(inp.value.trim());inp.value='';render()}
function delTask(i){tasks.splice(i,1);render()}
document.getElementById('taskInput').addEventListener('keypress',e=>{if(e.key==='Enter')addTask()});
render();
</script>
</body>
</html>
