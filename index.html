<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arka's To-Do Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
body{margin:0;min-height:100vh;font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:#fff;width:100%;max-width:420px;border-radius:20px;padding:30px;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
h1{text-align:center;margin:0 0 20px;color:#333}
.input-box{display:flex;gap:10px;margin-bottom:20px}
#taskInput{flex:1;padding:14px;border-radius:12px;border:2px solid #eee;outline:none;font-size:16px}
#taskInput:focus{border-color:#667eea}
button.add{background:#667eea;color:white;border:none;padding:0 22px;border-radius:12px;font-weight:600;cursor:pointer;transition:0.2s}
button.add:active{transform:scale(0.95)}
.task{background:#f7f7ff;padding:12px 16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;transition:all 0.4s ease;overflow:hidden}
.task.delete-anim{transform:translateX(100%);opacity:0;height:0;padding:0 16px;margin:0}
.task-left{display:flex;align-items:center;gap:10px;flex:1}
.task-left input{width:20px;height:20px;accent-color:#667eea}
.task-text{flex:1;transition:0.2s}
.strike{text-decoration:line-through;color:#888;opacity:0.7}
.del{color:#ff4d4d;background:none;border:none;font-size:18px;cursor:pointer;font-weight:bold;transition:0.2s}
.del:hover{transform:scale(1.3)}
.footer{text-align:center;margin-top:20px;font-size:12px;color:#888}
</style>
</head>
<body>
<div class="card">
<h1>✨ My Tasks</h1>
<div class="input-box">
<input id="taskInput" placeholder="New task likho...">
<button class="add" onclick="addTask()">Add</button>
</div>
<div id="taskList"></div>
<div class="footer">Made with ❤️ by Arka</div>
</div>
<script>
let tasks=JSON.parse(localStorage.getItem('my-tasks')||'[]');
function render(){
let list=document.getElementById('taskList');
list.innerHTML='';
for(let i=0;i<tasks.length;i++){
let t=tasks[i];
let div=document.createElement('div');
div.className='task';
div.id='task-'+i;
let left=document.createElement('div');
left.className='task-left';
let chk=document.createElement('input');
chk.type='checkbox';
chk.checked=t.done;
chk.onchange=(function(idx){return function(){toggleTask(idx)}})(i);
let span=document.createElement('span');
span.className='task-text'+(t.done?' strike':'');
span.textContent=t.text;
left.appendChild(chk);
left.appendChild(span);
let del=document.createElement('button');
del.className='del';
del.textContent='X';
del.onclick=(function(idx){return function(){delTask(idx)}})(i);
div.appendChild(left);
div.appendChild(del);
list.appendChild(div);
}
localStorage.setItem('my-tasks',JSON.stringify(tasks));
}
function addTask(){
let inp=document.getElementById('taskInput');
if(!inp.value.trim())return;
tasks.push({text:inp.value.trim(),done:false});
inp.value='';
render();
}
function toggleTask(i){tasks[i].done=!tasks[i].done;render();}
function delTask(i){
let el=document.getElementById('task-'+i);
if(el){
el.classList.add('delete-anim');
setTimeout(function(){
tasks.splice(i,1);
render();
},400);
}else{
tasks.splice(i,1);
render();
}
}
document.getElementById('taskInput').addEventListener('keypress',function(e){if(e.key==='Enter')addTask();});
render();
</script>
</body>
</html>
